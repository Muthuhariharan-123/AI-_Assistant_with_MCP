services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./Backend
    ports:
      - "5000:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MCP_SERVER_URL=http://mcp-server:3001
    depends_on:
      - mcp-server

  mcp-server:
    build: ./mcp-server
    ports:
      - "3001:3001"
